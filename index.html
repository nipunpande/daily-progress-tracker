<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhakti Sastri Study Tracker</title>
    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --bg: #fffbeb;
            --card-bg: #ffffff;
            --text: #78350f;
            --border: #fcd34d;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }
        h1, h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }
        .progress-container {
            background: #fdf2e9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }
        .progress-bar-bg {
            background: #e5e7eb;
            border-radius: 4px;
            height: 12px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-bar {
            background: var(--primary);
            width: 0%;
            height: 100%;
            transition: width 0.3s ease;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        @media (max-width: 650px) { .grid { grid-template-columns: 1fr; } }
        .card {
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            background: #ffffff;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.9em;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-download { background: #059669; }
        .btn-download:hover { background: #047857; }
        .btn-clear { background: #dc2626; }
        .btn-clear:hover { background: #b91c1c; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: left;
            font-size: 0.9em;
        }
        th { background: #f8fafc; }
    </style>
</head>
<body>

<div class="container">
    <h1>📖 Bhakti Sastri Offline Tracker</h1>
    
    <div class="progress-container">
        <label>Weekly Study Target: <span id="target-status">0 / 10 Hours</span></label>
        <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <div class="grid">
        <!-- Panel 1: Main Books -->
        <div class="card">
            <h2>Scripture Log</h2>
            <label>Date</label>
            <input type="date" id="study-date">
            
            <label>Select Book</label>
            <select id="book-select">
                <option value="Bhagavad Gita">Bhagavad Gita</option>
                <option value="Srimad Bhagavatam Canto 1">Srimad Bhagavatam Canto 1</option>
                <option value="Nectar of Instruction">Nectar of Instruction</option>
                <option value="Nectar of Devotion">Nectar of Devotion</option>
                <option value="Isopanishad">Isopanishad</option>
            </select>
            
            <label>Chapters / Verses Covered</label>
            <input type="text" id="book-chapters" placeholder="e.g. Ch 4, Verses 1-5">
            
            <label>Study Duration</label>
            <input type="text" id="book-duration" placeholder="e.g. 1.5 hours">
            
            <label>Remarks & Notes</label>
            <textarea id="book-remarks" rows="2" placeholder="Insights..."></textarea>
            
            <button onclick="addEntry('Scripture')">Save Scripture Progress</button>
        </div>

        <!-- Panel 2: Independent Topics -->
        <div class="card">
            <h2>Songs & Revisions</h2>
            <label>Date</label>
            <input type="date" id="other-date">

            <div style="border-bottom: 1px solid var(--border); margin-bottom: 15px; padding-bottom: 10px;">
                <label style="color: var(--primary);">🎵 Vaisnava Acarya Songs</label>
                <input type="text" id="song-name" placeholder="Song Name (e.g. Radhika Astaka)">
                <input type="text" id="song-duration" placeholder="Duration (e.g. 20 mins)">
                <button onclick="addEntry('Song')">Save Song Practice</button>
            </div>

            <div>
                <label style="color: var(--primary);">🔄 Verses Revision</label>
                <input type="text" id="revision-chapters" placeholder="Verses reviewed">
                <input type="text" id="revision-duration" placeholder="Duration (e.g. 30 mins)">
                <button onclick="addEntry('Revision')">Save Revision Progress</button>
            </div>
        </div>
    </div>

    <h2>📜 History Log</h2>
    <div style="overflow-x: auto;">
        <table id="history-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Topic / Item</th>
                    <th>Details</th>
                    <th>Duration</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>
    </div>

    <div class="btn-group">
        <button class="btn-download" onclick="downloadStatus()">📥 Download Weekly Status</button>
        <button class="btn-clear" onclick="clearLogs()">⚠️ Clear All Entries</button>
    </div>
</div>

<script>
    const todayObj = new Date();
    const yyyy = todayObj.getFullYear();
    const mm = String(todayObj.getMonth() + 1).padStart(2, '0');
    const dd = String(todayObj.getDate()).padStart(2, '0');
    const formattedDateString = `${yyyy}-${mm}-${dd}`;
    
    document.getElementById('study-date').value = formattedDateString;
    document.getElementById('other-date').value = formattedDateString;

    let logs = [];
    try {
        logs = JSON.parse(localStorage.getItem('bhakti_sastri_offline_logs')) || [];
    } catch(e) {
        logs = [];
    }

    function updateUI() {
        localStorage.setItem('bhakti_sastri_offline_logs', JSON.stringify(logs));
        const tbody = document.getElementById('history-body');
        tbody.innerHTML = '';
        
        let totalMinutes = 0;

        logs.forEach(log => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${log.date}</td>
                <td><b>${log.item}</b></td>
                <td>${log.details}</td>
                <td>${log.duration}</td>
                <td>${log.remarks || '-'}</td>
            `;
            tbody.appendChild(row);

            const timeStr = log.duration.toLowerCase();
            const numericalVal = parseFloat(timeStr) || 0;
            if(timeStr.includes('min') || timeStr.includes('m')) {
                totalMinutes += numericalVal;
            } else {
                totalMinutes += numericalVal * 60; 
            }
        });

        const totalHours = (totalMinutes / 60).toFixed(1);
        document.getElementById('target-status').innerText = `${totalHours} / 10 Hours`;
        const percentage = Math.min((totalHours / 10) * 100, 100);
        document.getElementById('progress-bar').style.width = percentage + '%';
    }

    function addEntry(type) {
        let entry = {};
        if (type === 'Scripture') {
            entry = {
                date: document.getElementById('study-date').value,
                item: document.getElementById('book-select').value,
                details: document.getElementById('book-chapters').value || 'N/A',
                duration: document.getElementById('book-duration').value || '0 mins',
                remarks: document.getElementById('book-remarks').value || 'Read successfully'
            };
            document.getElementById('book-chapters').value = '';
            document.getElementById('book-duration').value = '';
            document.getElementById('book-remarks').value = '';
        } else if (type === 'Song') {
            entry = {
                date: document.getElementById('other-date').value,
                item: 'Vaisnava Acarya Song',
                details: document.getElementById('song-name').value || 'N/A',
                duration: document.getElementById('song-duration').value || '0 mins',
                remarks: 'Song Practice'
            };
            document.getElementById('song-name').value = '';
            document.getElementById('song-duration').value = '';
        } else if (type === 'Revision') {
            entry = {
                date: document.getElementById('other-date').value,
                item: 'Verses Revision',
                details: document.getElementById('revision-chapters').value || 'N/A',
                duration: document.getElementById('revision-duration').value || '0 mins',
                remarks: 'Reviewing verses'
            };
            document.getElementById('revision-chapters').value = '';
            document.getElementById('revision-duration').value = '';
        }

        if(!entry.date) {
            alert("Please pick a valid date.");
            return;
        }
        
        logs.unshift(entry);
        updateUI();
    }

    function downloadStatus() {
        if(logs.length === 0) {
            alert("No logs logged yet to download.");
            return;
        }
        let outputText = "BHAKTI SASTRI PROGRESS SHEET\n============================\n\n";
        logs.forEach(l => {
            outputText += `Date: ${l.date}\nItem: ${l.item}\nDetails: ${l.details}\nDuration: ${l.duration}\nRemarks: ${l.remarks}\n-------------------------\n`;
        });
        
        const blob = new Blob([outputText], { type: 'text/plain' });
        const downloadElement = document.createElement('a');
        downloadElement.href = URL.createObjectURL(blob);
        downloadElement.download = 'Bhakti_Sastri_Report.txt';
        downloadElement.click();
    }

    function clearLogs() {
        if (confirm("Clear all rows completely? Make sure you backed up first!")) {
            logs = [];
            updateUI();
        }
    }

    updateUI();
</script>

</body>
</html>
